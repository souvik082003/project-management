{% extends "base.html" %}

{% block title %}404 Not Found - Academic PMS{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="display-1 text-warning fw-bold"><i class="bi bi-question-circle"></i> 404</div>
        <h2 class="h3 fw-bold mt-3 mb-2">Page Not Found</h2>
        <p class="text-muted mb-4">
            The page or resource you are looking for does not exist or may have been moved.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary">
                <i class="bi bi-house me-1"></i> Home
            </a>
            <a href="/dashboard/" class="btn btn-primary">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
